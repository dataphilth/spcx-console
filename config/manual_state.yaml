# Questions that could not be resolved. Each pass should attempt one and record
# the result, including failure to resolve.
unresolved:
  - id: q_shares
    text: "Share count does not bridge. Earnings release uses 5,864M weighted-average shares for $(0.09) EPS; 10-Q cover shows 13.18B outstanding. Pull the share-class table before any per-share work."
    opened: "2026-08-14"
  - id: q_cash_definition
    text: "$93.5B cash and equivalents per earnings coverage vs ~$100B cash plus marketable securities. L4 keys off this. Pick one definition permanently and record which."
    opened: "2026-08-20"
  - id: q_lockup_text
    text: "424B4 truncates before 'Shares Eligible for Future Sale'. Tranche dates are reconstructed from the FWP summary plus press."
    opened: "2026-08-14"
  - id: q_failed_trigger
    text: "455.8M shares whose price trigger failed (required >=$175.50 on 5 of 10 days pre-earnings) — do they roll into December or re-trigger later?"
    opened: "2026-08-14"
  - id: q_2027_bucket
    text: "The 2027 insider bucket. FWP implies ~1.58B shares by residual math; secondary coverage says day 366 unlocks everything. Least verified, most consequential item on the board."
    opened: "2026-08-14"
  - id: q_nvidia_stake
    text: "Nvidia disclosed a $21B stake as of quarter-end (Aug 14). Confirm against the 13F and establish whether it is the converted xAI position from the January $20B round."
    opened: "2026-08-20"
  - id: q_china_reusable
    text: "China landed a reusable rocket (~Aug 19). Establish vehicle, class, and whether orbital. First credible non-US reusability datapoint; belongs in the competitive set if it holds up."
    opened: "2026-08-20"
  - id: q_govt_revenue
    text: "Government revenue is never broken out — only a combined enterprise-and-government line. Any '% from government' figure in circulation is someone's estimate."
    opened: "2026-08-14"

