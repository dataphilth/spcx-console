# Questions that could not be resolved. Each pass should attempt one and record
# the result, including failure to resolve.
unresolved:
  - id: q_lockup_text
    text: "424B4 truncates before 'Shares Eligible for Future Sale'. Tranche dates are reconstructed from the FWP summary plus press."
    opened: "2026-08-14"
  - id: q_2027_bucket
    text: "The 2027 insider bucket. FWP implies ~1.58B shares by residual math; secondary coverage says day 366 unlocks everything. Least verified, most consequential item on the board."
    opened: "2026-08-14"
  - id: q_govt_revenue
    text: "Government revenue is never broken out — only a combined enterprise-and-government line. Any '% from government' figure in circulation is someone's estimate."
    opened: "2026-08-14"

resolved:
  - id: q_failed_trigger
    text: "455.8M shares whose price trigger failed (required >=$175.50 on 5 of 10 days pre-earnings) - do they roll into December or re-trigger later?"
    resolution: "They roll into the day-180 release (Dec 8 2026), making that release ~798M shares instead of ~342M. Three aggregators converge (TOPONE, PurePowerPicks, RoWS); the covenant itself was not read verbatim so confidence is medium and q_lockup_text stays open. Same sources give the tranche rule: days 70/90/105/120/135/180 from June 11 pricing -> Sep 9 / Sep 24 / Oct 9 / Oct 24 / Dec 8; the November tranche floats ~2 trading days after Q3 earnings. Closed Sep 6."
    closed: "2026-09-06"
  - id: q_shares
    text: "Share count does not bridge. Earnings release uses 5,864M weighted-average shares for $(0.09) EPS; 10-Q cover shows 13.18B outstanding."
    resolution: "They bridge exactly. The IPO closed June 12 2026 with ~19 of 91 days left in Q2, and at IPO all 2,046M redeemable convertible preferred converted to common (Class A 1,952M -> 7,607M) plus 638.9M new Class A were sold - so most of today's 13.18B counted as common for only ~1/5 of the quarter. Arithmetic: ~3.93B pre-IPO common x 72/91 + 13.18B x 19/91 = ~5,864M, the reported figure; H1 weighted average 4,879M is internally consistent. Standard ASC 260, not an error. Gap closes mechanically at Q3. stockanalysis.com now shows 13.57B outstanding (Cursor stock consideration). Per-share work should use period-end counts, never the Q2 weighted average. Sources: Q2 earnings release PDF (Q4 CDN mirror), 10-Q via StockTitan mirror, read Sep 13."
    closed: "2026-09-13"
  - id: q_cash_definition
    text: "$93.5B cash and equivalents vs ~$100B cash plus marketable securities."
    resolution: "Q2 release balance sheet: cash & equivalents $93,522M plus marketable securities $6,487M = the ~$100B. L4 keys off cash & equivalents only (the XBRL tag already collected). Source: Q2 2026 release PDF via StockTitan, Aug 4."
    closed: "2026-08-30"
  - id: q_nvidia_stake
    text: "Nvidia $21B stake - converted xAI position?"
    resolution: "Yes per two independent secondary sources (Yahoo Finance Aug 17; 247wallst Aug 15): Nvidia's $10B in xAI's Jan 2026 round converted to ~122.8M SPCX Class A in the merger, ~$21B at 6/30. Press-based; 13F not independently read - confidence medium."
    closed: "2026-08-30"
  - id: q_china_reusable
    text: "China reusable rocket landing ~Aug 19."
    resolution: "Zhuque-3, LandSpace (private), medium-lift ~18.3t LEO, orbital mission (its 2nd), first-stage leg landing Aug 18/19. First non-US orbital-class booster recovery. Sources: Space.com Aug 19; CGTN Aug 19. In the competitive set."
    closed: "2026-08-30"
  - id: q_tranche3_date
    text: "Tranche 3 date dispute (Aug 12 vs Aug 21)."
    resolution: "Aug 20 2026, ~319M shares. Multiple outlets converge."
    closed: "2026-08-20"
