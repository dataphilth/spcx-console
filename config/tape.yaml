# ============================================================================
# The TAPE layer — price, volatility, options, setups, ladder, catalysts.
#
# Everything in this file is CONTEXT. Nothing here is a criterion and nothing
# here can move a criterion's status. That separation is the point: criteria.yaml
# says what would change the thesis; this file says what the tape is doing while
# we wait. `spcx tape` reads it; `spcx dashboard` renders it beside the board.
#
# Every setup the tape layer surfaces carries BOTH a long read and a short read.
# It never says buy or sell.
# ============================================================================

# ---------------------------------------------------------------------------
# Position of record. Two ledgers, tagged at purchase, never reclassified.
# ---------------------------------------------------------------------------
position:
  lots:
    - date: 2026-08-13
      shares: 13
      price: 137.85
      sleeve: core            # confirmed 2026-08-25: all 13 are core
      # band: Current         # add when a lot fills a ladder band
  core_target_shares: 100     # first 100-lot is CORE (decided 2026-08-25): never sold, never written against
  first_lot_sleeve: core      # => covered calls need a SECOND, satellite 100-lot. Real target is 200.
  satellite_max_dollars: 0    # 0 = satellite sleeve not yet funded
  total_budget_dollars: 0     # 0 = ladder is aspirational until funded (Phil, 2026-08-25: "not yet")
  ladder_shape: even          # when funded: roughly equal shares per band Current..Dip 3, smaller reserve for Dip 4-5

# ---------------------------------------------------------------------------
# Share structure. Yahoo's "short % of float" divides by TOTAL shares outstanding
# (13.18B), which understates it ~8x for a name whose public float is 11.8%.
# The tape recomputes against the public float below. Update after each 10-Q
# and each lockup tranche; the number is only as fresh as as_of.
# ---------------------------------------------------------------------------
share_structure:
  shares_outstanding_b: 13.18
  public_float_b: 1.55
  as_of: 2026-08-14
  source: "10-Q cover (8/4/26) + FWP lockup schedule; float per thesis v0.2"

# ---------------------------------------------------------------------------
# Accumulation ladder. Evaluated on the daily close. shares: 0 = defined but
# unfunded. The ladder PAUSES itself when any long-case Tier-1 criterion has
# fired, or when two or more long-case Tier-2 criteria have fired.
# ---------------------------------------------------------------------------
ladder:
  rules:
    - "No band is bought twice without a new low inside that band."
    - "Every purchase below $105 requires a written Tier-1 criteria check first."
    - "Dry powder reserved for deeper bands is not spendable on shallower ones."
    - "Time-based tranches may supplement price-based ones."
  bands:
    - {name: Current, low: 135, high: 145, shares: 0}
    - {name: Dip 1,   low: 120, high: 135, shares: 0}
    - {name: Dip 2,   low: 105, high: 120, shares: 0, note: "Retests the Aug 3 low of $104.83"}
    - {name: Dip 3,   low: 85,  high: 105, shares: 0, requires_criteria_check: true, note: "Below all-time low"}
    - {name: Dip 4,   low: 60,  high: 85,  shares: 0, requires_criteria_check: true}
    - {name: Dip 5,   low: 25,  high: 60,  shares: 0, requires_criteria_check: true, note: "Only if zero long Tier-1 criteria fired"}

# ---------------------------------------------------------------------------
# Catalyst calendar. `confidence` is about the DATE, not the event.
# ---------------------------------------------------------------------------
catalysts:
  - {date: 2026-09-15, event: "STARSHIP FLIGHT 14 - first orbital attempt; no ship catch (dropped 8/20)", kind: starship, confidence: low, tests: [L8], note: "NET early-mid Sep per Space.com 8/21; nextspaceflight NET Sep; B21 static fire pending; placeholder date"}
  - {date: 2026-09-10, event: "Lockup tranche 4 (~7%)", kind: lockup, confidence: medium}
  - {date: 2026-09-25, event: "Lockup tranche 5 (~7%)", kind: lockup, confidence: medium}
  - {date: 2026-10-12, event: "Lockup tranche 6 (~7%)", kind: lockup, confidence: low}
  - {date: 2026-10-26, event: "Lockup tranche 7 (~7%)", kind: lockup, confidence: low}
  - {date: 2026-11-03, event: "Q3 2026 earnings", kind: earnings, confidence: low, tests: [L1, L2, L3, L4, L12, L13, S1, S2, S3, S4, S9], note: "Wall Street Horizon estimate; not company-confirmed"}
  - {date: 2026-11-05, event: "Lockup tranche 8 — 28% / ~1.28B sh (4x anything prior)", kind: lockup, confidence: medium, tests: [S7]}
  - {date: 2026-12-09, event: "Day 180 — bucket (iii) remainder unlocks", kind: lockup, confidence: medium}
  - {date: 2027-02-15, event: "Q4/FY26 earnings — insider bucket (ii) begins", kind: earnings, confidence: low}
  - {date: 2027-06-12, event: "12-month seasoning clears (S&P 500 profitability test still fails)", kind: index, confidence: high}
  - {date: 2027-06-13, event: "MUSK'S ~6.4B SHARES UNLOCK (~4x current float)", kind: lockup, confidence: medium}

# ---------------------------------------------------------------------------
# Explicit NOISE. Printed every run. Never escalated on.
# ---------------------------------------------------------------------------
noise:
  - Any single-day or single-week price move, in either direction
  - A Starship test-flight failure during the test campaign
  - Musk posting anything (personal, feuds, controversy)
  - Analyst rating changes and price-target revisions
  - A lockup tranche passing
  - Short-interest headlines
  - Any named bear or bull being loud

# ---------------------------------------------------------------------------
# Signal parameters.
# ---------------------------------------------------------------------------
signals:
  atr_window: 20
  hv_windows: [10, 30]
  sma_windows: [20, 50]
  rsi_window: 14
  range_window: 20
  volume_z_window: 20
  extreme_atr_multiple: 2.0
  volume_climax_z: 2.5
  iv_hv_rich_spread: 15
  iv_hv_cheap_spread: -15
  skew_put_rich_pts: 12       # 30d 25Δ put IV − call IV; single-stock normal is ~+3..+8
  skew_call_rich_pts: -3      # calls bid above puts — unusual
  iv_jump_pts: 10             # day-over-day IV30 move that gets flagged
  min_history_for_ivrank: 60
  catalyst_lookahead_days: 10
  history_bars_for_chart: 90
