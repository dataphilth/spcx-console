name: daily

# Weekdays after the US close. Snapshots are dated by run date, so a missed day
# is a visible gap in the record rather than a silently backfilled guess.
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: spcx-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Test before collecting
        # A broken evaluator would write wrong statuses into an append-only
        # record. Cheaper to fail here than to correct history later.
        run: pytest -q

      - name: Collect and evaluate
        id: run
        env:
          # The SEC requires a declaring contact. Set this as a repo secret.
          SPCX_CONTACT: ${{ secrets.SPCX_CONTACT }}
        run: python -m spcx.cli run --force
        continue-on-error: true

      - name: Check for stale manual inputs
        id: staleness
        run: python -m spcx.cli check
        continue-on-error: true

      - name: Commit the snapshot
        run: |
          git config user.name  "spcx-console"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open an issue on a status change
        if: steps.run.outcome == 'failure' && hashFiles('data/alert.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Criterion status change — $(date -u +%Y-%m-%d)" \
            --body-file data/alert.md \
            --label "status-change"

      - name: Open an issue when the judgment pass is due
        if: steps.staleness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m spcx.cli check > /tmp/stale.txt 2>&1 || true
          OPEN=$(gh issue list --label "judgment-pass" --state open --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            gh issue create \
              --title "Judgment pass due — $(date -u +%Y-%m-%d)" \
              --body "$(cat /tmp/stale.txt)"$'\n\n'"Run \`python -m spcx.cli brief\` and work the prompt it prints." \
              --label "judgment-pass"
          fi
